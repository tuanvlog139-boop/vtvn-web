<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SV VT VN.COM - Đăng Ký</title>
    <link rel="icon" type="image/png" href="https://cdn.phototourl.com/free/2026-07-23-c77cb032-5206-4e48-9048-a2a63ce065de.png">
    <link rel="stylesheet" href="gaming-theme.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-navy) 100%);
        }

        .auth-box {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            border: 2px solid rgba(255, 23, 68, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .auth-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-neon-red), var(--primary-neon-purple), var(--primary-neon-blue));
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-title {
            font-size: 32px;
            font-weight: bold;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 23, 68, 0.5);
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: var(--primary-neon-red);
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            background: var(--bg-navy);
            border: 2px solid rgba(255, 23, 68, 0.3);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-neon-red);
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-neon-red), var(--primary-neon-purple));
            color: var(--text-primary);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 23, 68, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 23, 68, 0.5);
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-footer a {
            color: var(--primary-neon-blue);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .form-footer a:hover {
            color: var(--primary-neon-red);
        }

        .error-message {
            color: var(--primary-neon-red);
            font-size: 13px;
            margin-top: 8px;
            display: none;
            font-weight: 600;
        }

        .success-message {
            color: #00e676;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 30px 20px;
            }

            .auth-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1 class="auth-title">📝 ĐĂNG KÝ</h1>
                <p class="auth-subtitle">Tạo tài khoản mới tại VT-VN Shop</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="username">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-input" placeholder="Nhập tên đăng nhập" required>
                    <div class="error-message" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Nhập email" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-input" placeholder="Nhập mật khẩu" required>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu" required>
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>

                <button type="submit" class="submit-btn">ĐĂNG KÝ</button>
            </form>

            <div class="form-footer">
                Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const usernameError = document.getElementById('usernameError');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');
            
            // Reset errors
            usernameError.style.display = 'none';
            emailError.style.display = 'none';
            passwordError.style.display = 'none';
            confirmPasswordError.style.display = 'none';
            
            let hasError = false;
            
            // Validate username
            if (username.length < 3) {
                usernameError.textContent = 'Tên đăng nhập phải có ít nhất 3 ký tự';
                usernameError.style.display = 'block';
                hasError = true;
            }
            
            // Validate email
            if (!email.includes('@')) {
                emailError.textContent = 'Email không hợp lệ';
                emailError.style.display = 'block';
                hasError = true;
            }
            
            // Validate password
            if (password.length < 6) {
                passwordError.textContent = 'Mật khẩu phải có ít nhất 6 ký tự';
                passwordError.style.display = 'block';
                hasError = true;
            }
            
            // Validate confirm password
            if (password !== confirmPassword) {
                confirmPasswordError.textContent = 'Mật khẩu xác nhận không khớp';
                confirmPasswordError.style.display = 'block';
                hasError = true;
            }
            
            if (hasError) return;
            
            // Check if username already exists
            const users = getUsers();
            if (users.find(u => u.username === username)) {
                usernameError.textContent = 'Tên đăng nhập đã tồn tại';
                usernameError.style.display = 'block';
                return;
            }
            
            // Create new user
            const newUser = {
                username: username,
                email: email,
                password: password,
                balance: 0,
                createdAt: new Date().toISOString()
            };
            
            users.push(newUser);
            saveUsers(users);
            
            alert('Đăng ký thành công! Vui lòng đăng nhập.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
