<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Chat Widget</title>
    <style>
        /* ==================== MESSENGER CHAT WIDGET ==================== */
        
        .messenger-chat-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0084ff, #00c6ff, #0084ff);
            background-size: 200% 200%;
            background-position: 0% 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 
                0 4px 20px rgba(0, 132, 255, 0.4),
                0 0 0 0 rgba(0, 132, 255, 0.7);
            animation: 
                pulse 3s ease-in-out infinite,
                gradientMove 3s linear infinite;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .messenger-chat-widget:hover {
            transform: scale(1.15);
            box-shadow: 
                0 6px 30px rgba(0, 132, 255, 0.6),
                0 0 0 10px rgba(0, 132, 255, 0.3);
        }

        .messenger-chat-widget svg {
            width: 32px;
            height: 32px;
            fill: white;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 
                    0 4px 20px rgba(0, 132, 255, 0.4),
                    0 0 0 0 rgba(0, 132, 255, 0.7);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 
                    0 6px 30px rgba(0, 132, 255, 0.6),
                    0 0 0 15px rgba(0, 132, 255, 0.4);
            }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .messenger-chat-widget {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
            }

            .messenger-chat-widget svg {
                width: 26px;
                height: 26px;
            }

            .messenger-chat-widget:hover {
                transform: scale(1.1);
            }
        }

        @media (max-width: 480px) {
            .messenger-chat-widget {
                bottom: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
            }

            .messenger-chat-widget svg {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>
<body>
